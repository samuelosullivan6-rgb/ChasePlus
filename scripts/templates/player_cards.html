<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Chase Decision Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: a scouting sheet. One control row, then the card: zone pictures
   on the left, the plan and the numbers on the right; one column on phones.
   Colors are the project's chart palette (README figures, video). */
:root {
  --surface: #fcfcfb;
  --plane: #f4f3ef;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #76746e;
  --hair: #e1e0d9;
  --axis: #c3c2b7;
  --mid: #e6e5de;
  --blue: #2a78d6;
  --red: #e34948;
  --whiff-more: #7a4fc9;
  --whiff-less: #2f9e6b;
  --league: #898781;
  --focus: #2a78d6;
  --ramp: #fcfcfb,#ece9e2,#d8d4c9,#c0bbae,#a39e90,#857f72,#635d51,#3e3a33;
  --font: "Avenir Next", "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #1a1a19; --plane: #121211; --ink: #ffffff; --ink2: #c3c2b7; --muted: #959389;
    --hair: #2c2c2a; --axis: #383835; --mid: #34342f; --blue: #3987e5; --red: #e66767;
    --whiff-more: #a98ae0; --whiff-less: #4fbf8a;
    --league: #898781; --focus: #6da7ec;
    --ramp: #1a1a19,#2b2b28,#3f3e3a,#56554f,#6f6d65,#8c897f,#aaa69b,#cdc8bb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface: #1a1a19; --plane: #121211; --ink: #ffffff; --ink2: #c3c2b7; --muted: #959389;
  --hair: #2c2c2a; --axis: #383835; --mid: #34342f; --blue: #3987e5; --red: #e66767;
  --whiff-more: #a98ae0; --whiff-less: #4fbf8a;
  --league: #898781; --focus: #6da7ec;
  --ramp: #1a1a19,#2b2b28,#3f3e3a,#56554f,#6f6d65,#8c897f,#aaa69b,#cdc8bb;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--plane); color: var(--ink); font-family: var(--font); font-size: 15px;
       line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 16px; }
/* two views of the same page: the controls each one does not use are hidden */
body[data-view="roster"] .card-only, body[data-view="card"] .roster-only { display: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; }
.control { display: grid; gap: 4px; min-width: 0; }
.control label, .control .label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.picker { display: flex; gap: 8px; flex-wrap: wrap; }
.picker input, .picker select { background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 7px 10px; min-width: 0; }
.picker input { width: 220px; max-width: 100%; }
.picker select { max-width: 320px; }
.notice { color: var(--ink2); background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 7px 12px; cursor: pointer; font-size: 14px; color: var(--ink2); text-transform: none; letter-spacing: 0; font-weight: 600; }
.seg label + input + label { border-left: 1px solid var(--axis); }
.seg input:checked + label { background: var(--ink); color: var(--surface); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: -2px; }
.seg[aria-disabled="true"] { opacity: .45; }

/* card */
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 24px; display: grid; gap: 20px; }
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px; padding-bottom: 18px; border-bottom: 1px solid var(--hair); }
.head h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 800; letter-spacing: -.01em; }
.head .sub { color: var(--ink2); font-size: 16px; }
.tiles { display: flex; gap: 32px; flex-wrap: wrap; }
.tile .big { font-size: 46px; font-weight: 800; line-height: 1; margin-top: 6px; }
.tile .note { color: var(--ink2); font-size: 13px; }
.bars { display: grid; grid-template-columns: auto 190px auto; gap: 6px 12px; align-items: center; margin-top: 8px; font-size: 15px; }
.bars .track { position: relative; height: 16px; }
.bars .track::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--axis); }
.bars .bar { position: absolute; top: 0; height: 16px; }
.bars .val { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.bars .lab { color: var(--ink2); }

.body { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 32px; }
/* a minmax(0, 1fr) column, not the implicit auto one: an auto column grows to a wide table's
   min-content width, so the table would spill past the card instead of scrolling in its .tablewrap */
.zones { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; align-content: start; }
.zgrid { display: grid; grid-template-columns: 92px repeat(4, minmax(0, 1fr)); gap: 8px; align-items: center; }
.zgrid .colhead { text-align: center; font-weight: 800; font-size: 15px; line-height: 1.2; }
.zgrid .colhead span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.zgrid .rowhead { font-weight: 800; font-size: 14px; line-height: 1.2; }
.zgrid .rowhead span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
.zgrid canvas { width: 100%; aspect-ratio: var(--panel-aspect); display: block; border-radius: 4px; cursor: crosshair; touch-action: none; }
.zfoot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; align-items: end; padding-left: 100px; }
.orient { color: var(--muted); font-size: 13px; }
.legend { display: grid; gap: 4px; font-size: 13px; color: var(--ink2); max-width: 300px; }
.legend .ramp { height: 12px; border-radius: 2px; }
.legend .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }

aside { display: grid; gap: 22px; align-content: start; min-width: 0; }
aside section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }   /* the column as in .zones */
aside h2 { font-size: 20px; font-weight: 800; }
.plan { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 16px; max-width: 68ch; }
.plan li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; }
.plan .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); margin: 8px 0 0 8px; }
.plan .keep { color: var(--ink2); font-size: 14px; }
.state { color: var(--muted); font-size: 13px; margin: 0; }
.zgrid .rowhead.whiff { border-top: 1px solid var(--axis); padding-top: 6px; }
.zgrid .whiffrule { grid-column: 1 / -1; border-top: 1px solid var(--axis); height: 0; }
.coach { border-left: 3px solid var(--axis); padding-left: 12px; color: var(--ink2); font-size: 14px; max-width: 72ch; }
.coach .eyebrow { display: block; margin-bottom: 2px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--axis); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; color: var(--ink2); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.leaks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.leaks li { display: grid; grid-template-columns: 26px minmax(0, 1fr) 120px auto; gap: 10px; align-items: center; }
.num { width: 24px; height: 24px; border: 1.6px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.leaks .what { min-width: 0; }
.leaks .rate { color: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; }
.leaks .runs { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.empty { color: var(--ink2); }
.tablewrap { overflow-x: auto; }
.tablebtn { display: none; border: 1px solid var(--axis); background: transparent; color: var(--ink2); border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; width: max-content; }
/* color stated on the table itself: a browser extension's user stylesheet that colors tables
   would otherwise win, since author rules only beat user rules when they exist */
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink); }
th, td { padding: 4px 8px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
thead th { color: var(--muted); font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--hair); vertical-align: bottom; }
thead th small { display: block; font-weight: 400; }
td .avg { color: var(--muted); margin-left: 6px; }
tr.total td { font-weight: 800; border-top: 1px solid var(--hair); }
.trend svg { width: 100%; height: auto; max-width: 520px; display: block; }
.evidence { color: var(--muted); font-size: 13px; max-width: 80ch; }
.evidence.target { color: var(--ink2, var(--muted)); }
details { border-top: 1px solid var(--hair); padding-top: 12px; }
.terrain { display: grid; gap: 8px; border-top: 1px solid var(--hair); padding-top: 14px; min-width: 0; }
.terrain h2 { font-size: 20px; font-weight: 800; }
.terrain-plot { width: 100%; height: 480px; min-width: 0; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--ink2); cursor: pointer; }
.zgrid canvas.selected { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (max-width: 640px) { .terrain-plot { height: 360px; } }
summary { cursor: pointer; font-weight: 700; }
.guide { margin: 0; padding-left: 22px; display: grid; gap: 8px; max-width: 70ch; }
.footer { color: var(--muted); font-size: 13px; max-width: 100ch; }

.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--axis);
       border-radius: 6px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 240px; }
.tip strong { font-size: 15px; }
.tip .k { color: var(--muted); }
.back { margin: 0; font-size: 14px; }
.back a { color: var(--blue); text-decoration: none; }
.back a:hover { text-decoration: underline; }

/* the roster: every hitter on one page, sorted by runs at stake, each name opening his card */
.roster { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; display: grid; gap: 14px; padding-top: 22px; overflow: hidden; }
.roster .rhead { padding: 0 24px; display: grid; gap: 6px; }
.roster h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -.01em; }
.roster .lede { margin: 0; color: var(--ink2); max-width: 90ch; }
.roster .scroll { overflow: auto; }
.roster table { border-collapse: collapse; width: 100%; min-width: 1560px; color: var(--ink); font-size: 14px; }
.roster th, .roster td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--hair); vertical-align: top; white-space: nowrap; }
.roster th:first-child, .roster td:first-child { padding-left: 24px; }
.roster th { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; cursor: pointer;
             position: sticky; top: 0; background: var(--surface); user-select: none; vertical-align: bottom; }
.roster th.sorted { color: var(--ink); }
.roster th .dir { font-size: 10px; margin-left: 3px; }
.roster th.right, .roster td.right { text-align: right; font-variant-numeric: tabular-nums; }
.roster td.plan { white-space: normal; min-width: 30ch; max-width: 40ch; color: var(--ink2); font-size: 13px; }
.roster td.leak { white-space: normal; min-width: 22ch; max-width: 28ch; }
.roster td.neg { color: var(--red); }
.roster td.pos { color: var(--blue); }
.roster a { color: var(--blue); text-decoration: none; }
.roster a:hover { text-decoration: underline; }
.roster .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--plane); color: var(--ink2); }
.roster .glossary { margin: 0; padding: 0 24px 22px; color: var(--muted); font-size: 13px; max-width: 110ch; }
.roster .none { padding: 0 24px 22px; color: var(--ink2); }
/* phones: each hitter as a short card (team, name, runs, top leak, start with) that opens on a tap */
@media (max-width: 720px) {
  .roster table { min-width: 0; }
  .roster thead { display: none; }
  .roster tbody tr { display: block; padding: 10px 16px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .roster tbody td { display: flex; justify-content: space-between; gap: 12px; border: 0; padding: 2px 0; white-space: normal; text-align: left; }
  .roster tbody td:first-child { padding-left: 0; font-weight: 700; }
  .roster tbody td::before { content: attr(data-label); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; flex: 0 0 auto; padding-top: 3px; }
  .roster tbody td.right { text-align: right; }
  .roster tbody td.plan { display: block; min-width: 0; max-width: none; padding-top: 6px; }
  .roster tbody td.plan::before { display: block; margin-bottom: 2px; }
  .roster tbody td.leak { min-width: 0; max-width: none; }
  .roster tbody td.more { display: none; }
  .roster tbody tr.open td.more { display: flex; }
}

/* one column: the plan, leaks and table come before the pictures, so a phone opens on the plan */
@media (max-width: 1100px) { .body { grid-template-columns: minmax(0, 1fr); } aside { order: -1; } }
@media (max-width: 640px) {
  .card { padding: 16px; }
  th.nar, td.nar { display: none; }
  .tablewrap.all th.nar, .tablewrap.all td.nar { display: table-cell; }
  .tablebtn { display: inline-block; }
  .head { grid-template-columns: minmax(0, 1fr); }
  .zgrid { grid-template-columns: 58px repeat(4, minmax(0, 1fr)); gap: 4px; }
  .zgrid .colhead { font-size: 12px; }
  .zgrid .rowhead { font-size: 12px; }
  .zgrid .rowhead span, .zgrid .colhead span { display: none; }
  .zfoot { padding-left: 0; }
  .leaks li { grid-template-columns: 26px minmax(0, 1fr) auto; }
  .leaks .rate { grid-column: 2; }
  .bars { grid-template-columns: auto 120px auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body data-view="card">
<div class="wrap">
  <div class="controls" role="group" aria-label="Page controls">
    <div class="control">
      <label for="season">Season</label>
      <div class="picker"><select id="season" aria-label="Choose a season"></select></div>
    </div>
    <div class="control">
      <span class="label" id="lab-view">View</span>
      <div class="seg" role="radiogroup" aria-labelledby="lab-view" id="seg-view">
        <input type="radio" name="view" id="view-roster" value="roster"><label for="view-roster">Roster</label>
        <input type="radio" name="view" id="view-card" value="card" checked><label for="view-card">Card</label>
      </div>
    </div>
    <div class="control">
      <label for="team">Team</label>
      <div class="picker"><select id="team" aria-label="Choose a team"><option value="">All teams</option></select></div>
    </div>
    <div class="control card-only">
      <label for="player-search">Hitter</label>
      <div class="picker">
        <input id="player-search" list="player-list" placeholder="Search by name" autocomplete="off">
        <datalist id="player-list"></datalist>
        <select id="player" aria-label="Choose a hitter"></select>
      </div>
    </div>
    <div class="control roster-only">
      <label for="q">Search</label>
      <div class="picker"><input id="q" type="search" placeholder="Hitter name" autocomplete="off"></div>
    </div>
    <div class="control roster-only">
      <label for="kind">Problem</label>
      <div class="picker"><select id="kind" aria-label="Filter by the kind of problem"><option value="">Any</option><option>choices</option><option>mostly choices</option><option>mixed</option><option>mostly contact</option><option>contact</option></select></div>
    </div>
    <div class="control card-only">
      <span class="label" id="lab-base">Compare with</span>
      <div class="seg" role="radiogroup" aria-labelledby="lab-base" id="seg-base">
        <input type="radio" name="base" id="base-match" value="match" checked><label for="base-match">Same side and hand</label>
        <input type="radio" name="base" id="base-all" value="all"><label for="base-all">All hitters</label>
      </div>
    </div>
    <div class="control card-only">
      <span class="label" id="lab-metric">Show</span>
      <div class="seg" role="radiogroup" aria-labelledby="lab-metric" id="seg-metric">
        <input type="radio" name="metric" id="metric-chase" value="chase" checked><label for="metric-chase">Chase choices</label>
        <input type="radio" name="metric" id="metric-whiff" value="whiff"><label for="metric-whiff">Misses on chases</label>
      </div>
    </div>
    <div class="control card-only">
      <span class="label" id="lab-pitch">Pitches</span>
      <div class="seg" role="radiogroup" aria-labelledby="lab-pitch" id="seg-pitch">
        <input type="radio" name="pitch" id="pitch-all" value="all" checked><label for="pitch-all">All</label>
        <input type="radio" name="pitch" id="pitch-fastball" value="0"><label for="pitch-fastball">Fastballs</label>
        <input type="radio" name="pitch" id="pitch-breaking" value="1"><label for="pitch-breaking">Breaking</label>
        <input type="radio" name="pitch" id="pitch-offspeed" value="2"><label for="pitch-offspeed">Changeups</label>
      </div>
    </div>
    <div class="control card-only">
      <span class="label" id="lab-hand">Plan, leaks and table</span>
      <div class="seg" role="radiogroup" aria-labelledby="lab-hand" id="seg-hand">
        <input type="radio" name="hand" id="hand-all" value="all" checked><label for="hand-all">All pitchers</label>
        <input type="radio" name="hand" id="hand-R" value="R"><label for="hand-R">vs RHP</label>
        <input type="radio" name="hand" id="hand-L" value="L"><label for="hand-L">vs LHP</label>
      </div>
    </div>
  </div>
  <p class="state" id="state"></p>
  <p class="notice" id="notice" hidden></p>
  <p class="back" id="back" hidden><a id="back-link" href="#roster">&larr; Back to the roster</a></p>

  <article class="card" id="card" aria-live="polite" hidden>
    <div class="head">
      <div>
        <h1 id="name"></h1>
        <div class="sub" id="line1"></div>
        <div class="sub" id="line2"></div>
      </div>
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="body">
      <div class="zones">
        <div class="zgrid" id="zgrid"></div>
        <div class="zfoot">
          <div class="orient" id="orient"></div>
          <div class="legend" id="legend"></div>
        </div>
        <details class="terrain" id="terrain-box">
          <summary>In 3D: the selected picture as a hill, taller where you swing more</summary>
          <label class="check" for="mesh"><input type="checkbox" id="mesh" checked> Show the average hitter as a mesh</label>
          <p class="evidence" id="terrain-note"></p>
          <div id="terrain" class="terrain-plot" role="img"></div>
        </details>
        <details id="numbers">
          <summary>Zone numbers</summary>
          <p class="evidence" id="numbers-note"></p>
          <div class="tablewrap"><table id="numbers-table"></table></div>
        </details>
      </div>
      <aside id="aside"></aside>
    </div>
  </article>

  <section class="roster" id="roster" aria-label="The roster" hidden>
    <div class="rhead">
      <h1 id="roster-title"></h1>
      <p class="lede" id="roster-lede"></p>
    </div>
    <div class="scroll"><table id="roster-table"><thead><tr></tr></thead><tbody></tbody></table></div>
    <p class="none" id="roster-none" hidden>No hitter matches. Clear the search, the team or the problem filter.</p>
    <p class="glossary" id="roster-glossary"></p>
  </section>
  <p class="footer" id="footer"></p>
</div>
<div class="tip" id="tip" hidden></div>

<script src="../seasons.js"></script>
<script>/*__CARD_MATH__*/</script>
<script type="application/json" id="card-data">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  const M = window.CardMath;
  const D = JSON.parse(document.getElementById("card-data").textContent);
  const XS = Float64Array.from(D.xs), ZS = Float64Array.from(D.zs);
  const NX = XS.length, NZ = ZS.length, STEP = D.gridStep;
  let MASK = new Uint8Array(NX * NZ);      // the current hitter's own zone
  let ZONE = [1.6, 3.2];
  const GROUPS = D.countGroups;           // [{key,label,detail}]
  const PITCH_NAMES = ["fastballs", "breaking balls", "changeups and splitters"];
  document.documentElement.style.setProperty("--panel-aspect", `${NX} / ${NZ}`);

  // ---- state ----
  for (const r of D.references) {
    for (const hand of Object.keys(r.grids)) {
      for (const g of Object.keys(r.grids[hand])) {
        const s = atob(r.grids[hand][g]);
        const u = new Uint8Array(s.length);

        if (row < 0) row = rows.findIndex((r) => r[2] === lk.side && r[4] === "chase");

  // The selected zone picture as a terrain: the floor is the plate area from
  // the catcher's view, height is the rate, and the gray mesh is the average
  // hitter on the same pitches. Same numbers as the flat picture.
  function drawTerrain(p) {
    const box = document.getElementById("terrain"), note = document.getElementById("terrain-note");
    const panel = panels[state.sel];
    if (!panel) return;
    if (!document.getElementById("terrain-box").open) return;
    if (!window.Plotly) {
      note.textContent = "Loading the 3D view…";
      box.hidden = true;
      ensurePlotly().then(
        () => { if (state.view === "card" && state.slug === p.slug) drawTerrain(p); },
        () => { note.textContent = "The 3D view loads a charting library from the internet and could not reach it. The flat pictures above show the same thing."; });
      return;
    }
    box.hidden = false;
    const mesh = document.getElementById("mesh").checked;
    const pctTxt = (v) => (isFinite(v) ? Math.round(v * 100) + "%" : "–");
    const zP = [], zL = [], col = [], txt = [];
    for (let b = 0; b < NZ; b++) {
      const rp = [], rl = [], rc = [], rt = [];
      for (let a = 0; a < NX; a++) {
        const j = b * NX + a;
        if (panel.kind === "rate") {
          const v = MASK[j] ? null : (panel.rates[j] / 255) * 100;
          rp.push(v); rc.push(v); rt.push(v == null ? "" : `${Math.round(v)}% of hitters swing here`);
          continue;
        }
        const s = panel.s;
        if (MASK[j] || s.evidence[j] < 0.25 || !isFinite(s.leagueRate[j])) { rp.push(null); rl.push(null); rc.push(null); rt.push(""); continue; }
        const lr = s.leagueRate[j], you = Math.min(1, Math.max(0, lr + s.gap[j]));
        const gap = Math.round(s.gap[j] * 100);
        rp.push(you * 100); rl.push(lr * 100); rc.push(s.gap[j] * 100);
        rt.push(`${panel.kind === "whiff" ? "Misses" : "Swings"}: you ${pctTxt(you)}, average ${pctTxt(lr)} (${gap > 0 ? "+" : gap < 0 ? "−" : ""}${Math.abs(gap)} pts)`);
      }
      zP.push(rp); zL.push(rl); col.push(rc); txt.push(rt);
    }
    const what = panel.kind === "whiff" ? "Misses on chases" : panel.kind === "rate" ? "Chase rate" : "Swing rate";
    note.textContent = `${panel.label}. Height is ${what.toLowerCase()}; ` +
      (panel.kind === "rate" ? "the floor is the plate area from the catcher's view. " :
        `color is the gap to the average hitter (red above, blue below)${mesh ? ", and the gray mesh is the average hitter on the same pitches" : ""}. `) +
      "Drag to turn it. Click any zone picture above to show it here; read exact numbers in the tables.";
    box.setAttribute("aria-label", `${panel.label}, ${what} in 3D`);
    const traces = [];
    if (panel.kind === "rate") {
      const stops = T.ramp.map((c, k) => [k / (T.ramp.length - 1), c]);
      traces.push({ type: "surface", x: Array.from(XS), y: Array.from(ZS), z: zP, surfacecolor: col, cmin: 0, cmax: 70,
                    colorscale: stops, showscale: false, text: txt, hovertemplate: "%{text}<extra></extra>" });
    } else {
      traces.push({ type: "surface", x: Array.from(XS), y: Array.from(ZS), z: zP, surfacecolor: col, cmin: -30, cmax: 30,
                    colorscale: panel.kind === "whiff" ? [[0, T.whiffLess], [0.5, T.mid], [1, T.whiffMore]] : [[0, T.blue], [0.5, T.mid], [1, T.red]], showscale: false,
                    text: txt, hovertemplate: "%{text}<extra></extra>" });
      if (mesh) traces.push({ type: "surface", x: Array.from(XS), y: Array.from(ZS), z: zL, hidesurface: true, showscale: false,
                    hoverinfo: "skip",
                    contours: { x: { show: true, start: -2, end: 2, size: 0.2, color: T.league, width: 1 },
                                y: { show: true, start: ZS[0], end: ZS[NZ - 1], size: 0.2, color: T.league, width: 1 } } });
    }
    // the zone outlined at the rim of the hole, on posts from the ground,
    // so the hole in the terrain lines up with it (same as the stills)
    let rimSum = 0, rimN = 0;
    for (let b = 0; b < NZ; b++) for (let a = 0; a < NX; a++) {
      const j = b * NX + a, v = zP[b][a];
      if (MASK[j] || v == null) continue;
      if (Math.abs(XS[a]) < 0.83 + 0.11 && ZS[b] > ZONE[0] - 0.11 && ZS[b] < ZONE[1] + 0.11) { rimSum += v; rimN++; }
    }
    const rim = rimN ? rimSum / rimN : 0;
    const zx = [-0.83, 0.83, 0.83, -0.83, -0.83], zy = [ZONE[0], ZONE[0], ZONE[1], ZONE[1], ZONE[0]];
    traces.push({ type: "scatter3d", mode: "lines", x: zx, y: zy, z: zx.map(() => rim), line: { color: T.ink, width: 5 }, hoverinfo: "skip", showlegend: false });
    for (let k = 0; k < 4; k++)
      traces.push({ type: "scatter3d", mode: "lines", x: [zx[k], zx[k]], y: [zy[k], zy[k]], z: [0, rim], line: { color: T.ink2, width: 2 }, opacity: 0.6, hoverinfo: "skip", showlegend: false });
    traces.push({ type: "scatter3d", mode: "lines", x: [-0.708, 0.708], y: [0, 0], z: [0, 0], line: { color: T.axis, width: 8 }, hoverinfo: "skip", showlegend: false });
    const axis = (title, range) => ({ title: { text: title, font: { size: 12, color: T.muted } }, range, color: T.muted,
      gridcolor: T.axis, zerolinecolor: T.axis, showbackground: false, tickfont: { size: 11, color: T.muted } });
    const font = getComputedStyle(document.body).fontFamily;
    Plotly.react(box, traces, {
      paper_bgcolor: T.surface, plot_bgcolor: T.surface, margin: { l: 0, r: 0, t: 0, b: 0 }, showlegend: false,
      font: { family: font, color: T.ink2 },
      hoverlabel: { bgcolor: T.surface, bordercolor: T.axis, font: { family: font, color: T.ink, size: 13 } },
      scene: {
        xaxis: axis("Catcher's view, ft", [-2, 2]), yaxis: axis("Height, ft", [ZS[0], ZS[NZ - 1]]),
        zaxis: axis(what + ", %", [0, 100]),
        aspectmode: "manual", aspectratio: { x: 1, y: (ZS[NZ - 1] - ZS[0]) / 4, z: 0.75 },
        camera: { eye: { x: -0.75, y: -1.45, z: 1.95 } },
      },
    }, { displaylogo: false, responsive: true, modeBarButtonsToRemove: ["toImage", "resetCameraLastSave3d"] });
  }

  function trendSvg(series, label) {
    const NS = "http://www.w3.org/2000/svg";
    const W = 520, H = 150, L = 44, R = 50, Tp = 12, B = 28;
    const years = D.leagueTrend.map((d) => d[0]);
    const vals = series.map((d) => d[1]).concat(D.leagueTrend.map((d) => d[1]));
    const top = Math.max(0.4, Math.ceil(Math.max(...vals) * 10) / 10);
    const sx = (y) => L + ((y - years[0] + 0.4) / (years[years.length - 1] - years[0] + 0.8)) * (W - L - R);
    const sy = (v) => Tp + (1 - v / top) * (H - Tp - B);
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", label);
    const add = (tag, attrs, text) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text != null) n.textContent = text; svg.append(n); return n; };
    for (let t = 0; t <= top + 1e-9; t += 0.1) {
      add("line", { x1: L, x2: W - R, y1: sy(t), y2: sy(t), stroke: "var(--hair)", "stroke-width": 1 });
      if (Math.round(t * 10) % 2 === 0) add("text", { x: L - 8, y: sy(t) + 4, "text-anchor": "end", "font-size": 12, fill: "var(--muted)" }, Math.round(t * 100) + "%");
    }
    years.forEach((y) => add("text", { x: sx(y), y: H - 8, "text-anchor": "middle", "font-size": 12, fill: y === D.season ? "var(--ink)" : "var(--muted)", "font-weight": y === D.season ? 800 : 400 }, y));   // the card's own season in bold: older cards show later seasons too
    const path = (pts) => pts.map(([y, v], k) => `${k ? "L" : "M"}${sx(y).toFixed(1)},${sy(v).toFixed(1)}`).join("");
    add("path", { d: path(D.leagueTrend), fill: "none", stroke: "var(--league)", "stroke-width": 2, "stroke-linecap": "round" });
    const lastL = D.leagueTrend[D.leagueTrend.length - 1];
    let avgY = sy(lastL[1]) + 4;
    if (series.length) {
      if (series.length >= 3) add("path", { d: path(series), fill: "none", stroke: "var(--ink)", "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round" });
      series.forEach(([y, v]) => add("circle", { cx: sx(y), cy: sy(v), r: 4.5, fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 2 }));
      const last = series[series.length - 1];
      add("text", { x: sx(last[0]) + 10, y: sy(last[1]) + 4, "font-size": 13, "font-weight": 800, fill: "var(--ink)" }, "you");
      if (Math.abs(sy(last[1]) - sy(lastL[1])) < 14) avgY = Math.max(sy(last[1]), sy(lastL[1])) + 18;
    }
    add("text", { x: sx(lastL[0]) + 10, y: avgY, "font-size": 13, fill: "var(--muted)" }, "avg");
    return svg;
  }

  function renderRoster() {
    const head = document.querySelector("#roster-table thead tr"); head.replaceChildren();
    for (const [k, label, num] of COLS) {
      const th = el("th", { class: (num ? "right " : "") + (state.sort === k ? "sorted" : ""), text: label, tabindex: "0",

      if (state.sort === k) th.append(el("span", { class: "dir", text: state.dir < 0 ? "▼" : "▲" }));
      const sortBy = () => { if (state.sort === k) state.dir = -state.dir; else { state.sort = k; state.dir = num ? -1 : 1; } renderRoster(); };
      th.addEventListener("click", sortBy);
      th.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); sortBy(); } });
      head.append(th);
    }
    const q = fold(state.q.trim());
    let rows = ROSTER.filter((r) => (!state.team || r.teams.includes(state.team)) && (!q || r.key.includes(q)) && (!state.kind || r.kind === state.kind));
    const key = state.sort === "target" ? "excess" : state.sort;
    rows = rows.slice().sort((a, b) => {
      const x = a[key], y = b[key];
      if (x === null || x === undefined || x === "") return 1;
      if (y === null || y === undefined || y === "") return -1;
      return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * state.dir;
    });
    rosterRows = rows;
    const body = document.querySelector("#roster-table tbody"); body.replaceChildren();
    for (const r of rows) {
      const tr = el("tr");
      tr.addEventListener("click", (e) => { if (!e.target.closest("a")) tr.classList.toggle("open"); });
      for (const [k, label, num] of COLS) {
        const td = el("td", { class: [num ? "right" : "", k === "plan" ? "plan" : "", k === "leak" ? "leak" : "", PHONE.has(k) ? "" : "more"].filter(Boolean).join(" "), "data-label": label });
        if (k === "player") { td.append(el("a", { href: "#" + r.slug, text: r.player })); if (r.noted) td.append(" ", el("span", { class: "tag", text: "noted" })); }
        else if (k === "team") td.textContent = r.teams.join(", ");
        else if (k === "xchase") td.textContent = `${r.xchase} · ${r.rank_txt}`;
        else if (k === "choices" || k === "contact" || k === "leak_runs") { td.textContent = fmtCell(k, r[k]); if (r[k] < -0.05) td.classList.add("neg"); else if (r[k] > 0.05) td.classList.add("pos"); }
        else td.textContent = fmtCell(k, r[k]);
        tr.append(td);
      }
      body.append(tr);
    }
    document.getElementById("roster-none").hidden = rows.length > 0;
    const phone = window.matchMedia("(max-width: 720px)").matches;   // no column heads to click there
    document.getElementById("state").textContent = `${rows.length} of ${ROSTER.length} hitters${state.team ? ` · ${state.team}` : ""} · sorted by ${COLS.find((c) => c[0] === state.sort)[1].toLowerCase()}${state.dir < 0 ? ", most first" : ""}.${phone ? "" : " Click a column to sort by it."}`;
  }

  // ---- the views ----
  const sel = document.getElementById("player"), list = document.getElementById("player-list"), teamSel = document.getElementById("team");
  TEAMS.forEach((t) => teamSel.append(el("option", { value: t, text: t })));
  const og = (label, people) => { const g = el("optgroup", { label }); people.forEach((p) => g.append(el("option", { value: p.slug, text: p.reference ? p.name : `${p.name} (${Math.round(p.xchase_plus)})` }))); return g; };
  let filledFor = null;
  function fillHitters() {                 // the hitter dropdown, narrowed to the team when one is picked
    if (filledFor !== state.team) {
      const mine = state.team ? D.players.filter((p) => p.teams.includes(state.team)) : D.players;
      sel.replaceChildren(og("Reference", D.references));
      for (const [key, label] of [["easiest", "Noted: easiest to improve"], ["biggest", "Noted: biggest losses"]]) {
        const group = mine.filter((p) => p.noted === key);
        if (group.length) sel.append(og(label, group));
      }
      sel.append(og(`${state.team ? state.team + " hitters" : "Every qualified hitter"}, by xChase+ (${mine.length})`, mine));
      list.replaceChildren(...mine.concat(D.references).map((p) => el("option", { value: p.name })));
      filledFor = state.team;
    }
    sel.value = state.slug;
  }
  function showView() {
    document.body.dataset.view = state.view;
    document.getElementById("roster").hidden = state.view !== "roster";
    document.getElementById("back").hidden = state.view !== "card";
    if (state.view === "roster") { document.getElementById("card").hidden = true; document.getElementById("tip").hidden = true; }
    document.querySelectorAll('input[name="view"]').forEach((r) => (r.checked = r.value === state.view));
    teamSel.value = state.team;
    document.getElementById("back-link").href = rosterHash(state.team);
  }
  function showCard() {
    ensurePlotly().catch(() => {});
    if (P) { render(); return; }
    document.getElementById("card").hidden = true;
    document.getElementById("state").textContent = `Loading the ${D.season} pitches…`;
    ensurePitches().then((ok) => { if (ok && state.view === "card") render(); });
  }
  function applyHash() {
    const h = parseHash();
    let note = null;
    if (h.view === "roster") {
      state.view = "roster";
      state.team = TEAMS.includes(h.team) ? h.team : "";
      if (h.team && !state.team) { note = `No ${h.team} in ${D.season}: showing every team.`; try { history.replaceState(null, "", rosterHash("")); } catch (e) {} }
      showView(); fillHitters(); renderRoster();
    } else {
      state.view = "card";
      let from = ""; try { from = sessionStorage.getItem("chaseFrom") || ""; sessionStorage.removeItem("chaseFrom"); } catch (e) {}
      if (bySlug.has(h.slug)) state.slug = h.slug;
      else if (h.slug) {                   // a hitter carried over from another season who has no card here
        const who = from || h.slug.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
        state.slug = D.references[0].slug;
        note = `${who} has no ${D.season} card: he did not qualify that season. Showing ${bySlug.get(state.slug).name.toLowerCase()} instead.`;
      } else if (!bySlug.has(state.slug)) state.slug = D.defaultSlug;
      showView(); showCard();
    }
    const n = document.getElementById("notice");
    n.textContent = note || ""; n.hidden = !note;
  }

  // ---- controls ----
  sel.addEventListener("change", () => { state.slug = sel.value; render(); });
  const search = document.getElementById("player-search");
  search.addEventListener("change", () => {
    const q = fold(search.value.trim());
    if (!q) return;
    const hit = everyone.find((p) => fold(p.name) === q) || everyone.find((p) => fold(p.name).includes(q));
    if (hit) { state.slug = hit.slug; render(); search.value = ""; }
  });
  document.querySelectorAll('input[name="view"]').forEach((r) => r.addEventListener("change", () => {
    if (!r.checked) return;
    // Roster to Card opens the first hitter listed unless the card's hitter is on the list
    if (r.value === "card" && state.view === "roster" && rosterRows.length && !rosterRows.some((x) => x.slug === state.slug)) state.slug = rosterRows[0].slug;
    const next = r.value === "roster" ? rosterHash(state.team) : "#" + state.slug;
    if (location.hash === next) applyHash(); else location.hash = next;
  }));
  teamSel.addEventListener("change", () => {
    state.team = teamSel.value;
    document.getElementById("back-link").href = rosterHash(state.team);
    if (state.view === "roster") { try { history.replaceState(null, "", rosterHash(state.team)); } catch (e) {} renderRoster(); return; }
    fillHitters();
    const p = bySlug.get(state.slug);
    if (state.team && p && !p.reference && !p.teams.includes(state.team)) {
      const first = D.players.find((q) => q.teams.includes(state.team));   // the team's first hitter in the dropdown
      if (first) { state.slug = first.slug; render(); }
    }
  });
  document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value; renderRoster(); });
  document.getElementById("kind").addEventListener("change", (e) => { state.kind = e.target.value; renderRoster(); });
  for (const [name, key] of [["base", "base"], ["metric", "metric"], ["pitch", "pitch"]])
    document.querySelectorAll(`input[name="${name}"]`).forEach((r) => r.addEventListener("change", () => { state[key] = r.value; render(); }));
  document.querySelectorAll('input[name="hand"]').forEach((r) => r.addEventListener("change", () => { state.hand = r.value; if (lastRender) { aside(lastRender); stateLine(lastRender); } }));

  document.getElementById("mesh").addEventListener("change", () => lastRender && drawTerrain(lastRender));
  document.getElementById("terrain-box").addEventListener("toggle", () => { if (lastRender && document.getElementById("terrain-box").open) drawTerrain(lastRender); });
  document.getElementById("footer").textContent = D.footer;
  window.addEventListener("hashchange", applyHash);

  readTheme();
  applyHash();
  const redrawAll = () => { readTheme(); if (lastRender && state.view === "card") { zones(lastRender); aside(lastRender); } };
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawAll); } catch (e) {}
  new MutationObserver(redrawAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => document.querySelectorAll("#zgrid canvas").forEach((c) => c._redraw && c._redraw()), 120); });
})();
</script>
</html>
